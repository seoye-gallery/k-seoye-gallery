<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작품 상세 감상 - 원당 김제운 작품 감상</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="gallery-header">
        <div class="header-content">
            <p class="site-category">한국 전통·원당 김제운 작품 감상</p>
            <h1>작품 상세 페이지</h1>
        </div>
    </header>

    <main class="detail-container" style="max-width: 800px; margin: 30px auto; padding: 20px;">
        <div class="artwork-display-box" style="text-align: center; margin-bottom: 30px;">
            <img src="7.jpg" alt="작품 사진" style="max-width: 100%; max-height: 500px; width: auto !important; height: auto !important; border: 1px solid #ddd; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        </div>

        <div class="artwork-info-section" style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #e0e0e0;">
            <h2 style="font-size: 1.2rem; border-bottom: 2px solid #333; padding-bottom: 8px; margin-top: 0;">작품 상세 정보</h2>
            <p style="margin: 10px 0;">• <strong>분류:</strong> 지본 작품</p>
            <p style="margin: 10px 0;">• <strong>중심 대자:</strong> -</p>
            <p style="margin: 10px 0;">• <strong>형식:</strong> 전통 서예 작품</p>
            <p style="margin: 10px 0;">• <strong>작가:</strong> 원당 김제운</p>
        </div>

        <div class="artwork-translation-section" style="margin-bottom: 30px;">
            <h2 style="font-size: 1.2rem; border-bottom: 2px solid #333; padding-bottom: 8px;">원문 및 한글 풀이</h2>
            <div style="margin-top: 15px;">
                <p style="font-weight: bold; margin-bottom: 5px;">[중심 글자 (대자)] -</p>
                <p style="margin: 0; color: #555; padding-left: 10px;">- 의미: 준비 중입니다.</p>
            </div>
        </div>

        <div class="artwork-review-section" style="margin-bottom: 40px;">
            <h2 style="font-size: 1.2rem; border-bottom: 2px solid #333; padding-bottom: 8px;">작품 심층 감상</h2>
            <p style="margin-top: 15px; line-height: 1.6; color: #333;">
                본 작품은 원당 김제운 작가 특유의 깊은 품격과 정성이 담긴 서예 작품입니다.
            </p>
        </div>

        <div class="detail-actions" style="text-align: center; margin-top: 40px; border-top: 1px solid #ddd; padding-top: 20px;">
            <a href="index.html" class="btn" style="display: inline-block; background: #333; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; margin-right: 10px;">← 작품 목록으로</a>
            <a href="#contact" class="btn" style="display: inline-block; background: #8b5a2b; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px;">소장 및 문의 →</a>
        </div>
    </main>
</body>
</html>
