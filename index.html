<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-서예 갤러리 ｜ 원당 김제운</title>
    
    <meta property="og:title" content="원당 서예 갤러리 ｜ 원당 김제운 작가 · 소장가 권영자">
    <meta property="og:description" content="한국 서예 작품 감상 - 원당 김제운 서예작가님의 작품을 소개합니다.">
    <meta property="og:image" content="1.jpg">
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Noto Serif KR', serif, sans-serif;
            background-color: #fbf9f5;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* 스케치하신 전체 대문 틀 */
        .main-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 680px;
            border: 2px solid #333;
            border-radius: 16px;
            padding: 35px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 540px;
        }

        /* 최상단 언어 선택 영역 */
        .top-lang-bar {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
            margin-bottom: 20px;
        }
        .lang-badge {
            border: 1px solid #666;
            padding: 3px 8px;
            font-size: 0.8rem;
            border-radius: 4px;
            background: #fff;
            color: #333;
            cursor: pointer;
        }

        /* 상단 2열 배치 (좌측 타이틀 + 우측 작품 2개) */
        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 30px;
        }

        /* 좌측: K-서예 및 묵향 문구 */
        .left-title-area {
            flex: 1;
        }
        .menu-icon-box {
            width: 28px;
            height: 28px;
            border: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            margin-bottom: 12px;
            border-radius: 4px;
        }
        .main-title {
            font-size: 2rem;
            font-weight: bold;
            color: #111;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }
        .sub-desc {
            font-size: 0.95rem;
            color: #555;
            line-height: 1.5;
        }

        /* 우측: 작품 2개 나란히 (복, 산) */
        .right-artworks {
            display: flex;
            gap: 12px;
        }
        .artwork-frame {
            width: 110px;
            height: 170px;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 4px;
            background-color: #faf9f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .artwork-frame img {
            width: 100%;
            height: 135px;
            object-fit: contain;
            background: #fff;
            border-radius: 2px;
        }
        .artwork-label {
            font-size: 0.8rem;
            font-weight: bold;
            color: #333;
            margin-top: 4px;
        }

        /* 중간: 한국 서예 작품 감상 타이틀 및 소개 */
        .middle-section {
            text-align: center;
            margin: 20px 0 35px 0;
            padding: 25px 15px;
            background-color: #fcfbfa;
            border: 1px solid #e5e0d8;
            border-radius: 10px;
        }
        .section-big-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #111;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .section-intro-text {
            font-size: 1.05rem;
            color: #555;
            line-height: 1.6;
        }
        .btn-enter-box {
            margin-top: 20px;
        }
        .btn-enter {
            display: inline-block;
            background-color: #8b2626;
            color: #fff;
            padding: 10px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .btn-enter:hover {
            background-color: #6b1c1c;
        }

        /* 하단: 주소 표기 영역 */
        .bottom-url-bar {
            border-top: 2px solid #333;
            padding-top: 15px;
            font-size: 0.9rem;
            color: #333;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        @media (max-width: 600px) {
            .top-section {
                flex-direction: column;
            }
            .right-artworks {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- 최상단 언어 선택 -->
        <div class="top-lang-bar">
            <span class="lang-badge">한</span>
            <span class="lang-badge">EN</span>
            <span class="lang-badge">日</span>
            <span class="lang-badge">中</span>
        </div>

        <!-- 상단 2열 (왼쪽 타이틀 + 오른쪽 대표작 복, 산) -->
        <div class="top-section">
            <div class="left-title-area">
                <div class="menu-icon-box">≡</div>
                <div class="main-title">K-서예</div>
                <div class="sub-desc">
                    붓끝으로 피워낸 묵향<br>
                    삶의 깊이를 담다
                </div>
            </div>

            <div class="right-artworks">
                <div class="artwork-frame">
                    <img src="1.jpg" alt="복 작품">
                    <div class="artwork-label">복(福)</div>
                </div>
                <div class="artwork-frame">
                    <img src="2.jpg" alt="산 작품">
                    <div class="artwork-label">산(山)</div>
                </div>
            </div>
        </div>

        <!-- 중앙 메인 안내 및 입장 버튼 -->
        <div class="middle-section">
            <div class="section-big-title">한국 서예 작품 감상</div>
            <div class="section-intro-text">
                원당 김제운 서예작가님의 작품을 소개합니다.
            </div>
            <div class="btn-enter-box">
                <a href="gallery.html" class="btn-enter">갤러리 입장하기 →</a>
            </div>
        </div>

        <!-- 하단 웹사이트 주소 -->
        <div class="bottom-url-bar">
            http://seoye-gallery.github.io/k-seoye-gallery/
        </div>
    </div>

</body>
</html>
