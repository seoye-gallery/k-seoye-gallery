<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원당 서예 갤러리</title>
    
    <!-- 카카오톡, 문자 공유 시 미리보기 카드 설정 -->
    <meta property="og:title" content="원당 서예 갤러리 ｜ 원당 김제운 작가">
    <meta property="og:description" content="붓끝으로 피워낸 墨香, 삶의 깊이와 평안을 담다.">
    <meta property="og:image" content="1.jpg">
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Noto Serif KR', serif, sans-serif;
            background-color: #fbf9f5;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .intro-card {
            background-color: #ffffff;
            color: #222;
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            text-align: center;
            padding: 40px 25px;
        }
        .intro-image {
            width: 100%;
            max-height: 280px;
            object-fit: contain;
            background-color: #fbf9f5;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .intro-hanja {
            color: #8b2626;
            font-size: 1.05rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .intro-title {
            font-size: 2rem;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 25px;
            color: #111;
            word-break: keep-all;
        }
        .intro-desc {
            font-size: 1.05rem;
            color: #666;
            line-height: 1.7;
            margin-bottom: 35px;
            word-break: keep-all;
        }
        .btn-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-enter {
            display: inline-block;
            background-color: #8b2626;
            color: #fff;
            padding: 15px 35px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background-color 0.3s;
            width: 100%;
            max-width: 280px;
        }
        .btn-enter:hover {
            background-color: #6b1c1c;
        }
    </style>
</head>
<body>

    <div class="intro-card">
        <!-- 대표 이미지 -->
        <img src="1.jpg" alt="원당 김제운 작가 작품" class="intro-image">
        
        <div class="intro-content">
            <div class="intro-hanja">韓國 書藝 · 元堂 金濟雲 藝苑</div>
            <h1 class="intro-title">
                붓끝으로 피워낸<br>
                墨香,<br>
                삶의 깊이와 평안을<br>
                담다
            </h1>
            <p class="intro-desc">
                한 자 한 자에 담긴 붓의 기운과 지극 한 정성.<br>
                원당 김제운 작가의 컬렉션을 전합니다.
            </p>
            
            <div class="btn-container">
                <!-- 갤러리 목록으로 연결 -->
                <a href="gallery.html" class="btn-enter">작품 감상하기</a>
            </div>
        </div>
    </div>

</body>
</html>
