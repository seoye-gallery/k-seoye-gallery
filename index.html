<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-서예 갤러리</title>
    
    <meta property="og:title" content="원당 서예 갤러리 ｜ 원당 김제운 작가 · 소장가 권영자">
    <meta property="og:description" content="붓끝으로 피워낸 墨香, 삶의 깊이와 평안을 담다.">
    <meta property="og:image" content="1.jpg">
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Noto Serif KR', serif, sans-serif;
            background-color: #f5f2ec;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* 스케치하신 전체 틀 */
        .sketch-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            border: 2px solid #333;
            border-radius: 16px;
            padding: 35px 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 520px;
            position: relative;
        }
        
        /* 상단: 왼쪽 메뉴/타이틀 & 오른쪽 세로 액자 */
        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        /* 왼쪽 영역 */
        .left-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
            padding-top: 5px;
        }
        .menu-box {
            width: 28px;
            height: 28px;
            border: 2px solid #333;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: bold;
        }
        .title-area {
            font-size: 2rem;
            font-weight: bold;
            color: #111;
            letter-spacing: -1px;
            line-height: 1.2;
        }
        .desc-area {
            font-size: 0.95rem;
            color: #555;
            line-height: 1.5;
            margin-top: 5px;
        }

        /* 오른쪽: 세로형 작품 액자 */
        .right-artwork {
            width: 160px;
            flex-shrink: 0;
        }
        .frame-box {
            width: 100%;
            height: 320px;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 6px;
            background-color: #faf9f6;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .frame-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 하단 영역 (http:// 및 입장 버튼) */
        .bottom-section {
            border-top: 2px solid #333;
            padding-top: 20px;
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .site-link {
            font-size: 1rem;
            font-weight: bold;
            color: #111;
            text-decoration: none;
        }
        .site-link:hover {
            text-decoration: underline;
        }
        .enter-btn {
            background-color: #8b2626;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .enter-btn:hover {
            background-color: #6b1c1c;
        }
    </style>
</head>
<body>

    <div class="sketch-card">
        <!-- 상단 2열 배치 -->
        <div class="top-section">
            <div class="left-content">
                <div class="menu-box">□</div>
                <div class="title-area">K-서예</div>
                <div class="desc-area">
                    붓끝으로 피워낸 墨香<br>
                    원당 김제운
                </div>
            </div>

            <div class="right-artwork">
                <div class="frame-box">
                    <img src="1.jpg" alt="서예 작품">
                </div>
            </div>
        </div>

        <!-- 하단 링크 영역 -->
        <div class="bottom-section">
            <a href="gallery.html" class="site-link">http:// 작품 감상</a>
            <a href="gallery.html" class="enter-btn">입장하기 →</a>
        </div>
    </div>

</body>
</html>
