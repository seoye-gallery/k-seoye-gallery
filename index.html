<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-서예 갤러리</title>
    
    <!-- 카카오톡, 문자 공유 시 미리보기 카드 설정 -->
    <meta property="og:title" content="K-서예 갤러리 ｜ 원당 김제운 작가 · 소장가 권영자">
    <meta property="og:description" content="붓끝으로 피워낸 묵향, 삶의 깊이와 평안을 담다. 원당 김제운 작가의 대작과 소장가 권영자의 소중한 컬렉션으로 여러분을 초대합니다.">
    <meta property="og:image" content="1.jpg">
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Noto Serif KR', serif, sans-serif;
            background-color: #222;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .intro-card {
            background-color: #fcfbfa;
            color: #222;
            width: 100%;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            text-align: left;
        }
        .intro-image {
            width: 100%;
            max-height: 320px;
            object-fit: contain;
            background-color: #f5f3f0;
            display: block;
            margin: 0 auto;
        }
        .intro-content {
            padding: 40px 30px;
            text-align: center;
        }
        .intro-hanja {
            color: #8b2626;
            font-size: 1.1rem;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }
        .intro-title {
            font-size: 2.2rem;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 20px;
            color: #111;
        }
        .intro-desc {
            font-size: 1.05rem;
            color: #555;
            line-height: 1.7;
            margin-bottom: 35px;
            word-break: keep-all;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-enter {
            display: inline-block;
            background-color: #8b2626;
            color: #fff;
            padding: 14px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .btn-enter:hover {
            background-color: #6b1c1c;
        }
        .btn-blog {
            background-color: #555;
        }
        .btn-blog:hover {
            background-color: #333;
        }
    </style>
</head>
<body>

    <div class="intro-card">
        <img src="1.jpg" alt="대표 작품" class="intro-image">
        
        <div class="intro-content">
            <div class="intro-hanja">韓國 書藝 · 원당 김제운 · 소장가 권영자</div>
            <h1 class="intro-title">한 폭의 그림에<br>묵향과 평안을 담습니다</h1>
            <p class="intro-desc">
                붓끝으로 피워낸 정성스러운 서예 작품들을 만나보세요.<br>
                족자, 지본, 액자 등 다양한 형태의 작품에 담긴 깊이와 여유를 전합니다.
            </p>
            
            <div class="btn-container">
                <a href="gallery.html" class="btn-enter">작품 보기</a>
                <a href="#" class="btn-enter btn-blog">서예 이야기</a>
            </div>
        </div>
    </div>

</body>
</html>
