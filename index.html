<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수복재 - 韓國 民畵</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Noto Serif KR', serif, sans-serif;
            background-color: #f7f5f0;
            color: #222;
            padding: 0;
        }
        /* 상단 네비게이션 바 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .badge {
            background-color: #b23b3b;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .site-title {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #222;
        }
        .nav-menu {
            display: flex;
            gap: 30px;
            font-size: 1.05rem;
            color: #444;
        }
        .nav-menu span {
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-menu span:hover {
            color: #b23b3b;
        }

        /* 메인 대문 콘텐츠 영역 */
        .hero-section {
            max-width: 900px;
            margin: 80px auto 60px auto;
            padding: 0 20px;
            text-align: left;
        }
        .sub-tag {
            font-size: 0.95rem;
            color: #777;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 3rem;
            line-height: 1.3;
            color: #111;
            margin-bottom: 30px;
            font-weight: normal;
        }
        h1 strong {
            font-weight: bold;
            color: #b23b3b;
        }
        .intro-text {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #555;
            margin-bottom: 50px;
        }

        /* 버튼 그룹 */
        .btn-group {
            display: flex;
            gap: 20px;
        }
        .btn-primary {
            background-color: #b23b3b;
            color: #fff;
            padding: 16px 45px;
            font-size: 1.1rem;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.2s;
            display: inline-block;
        }
        .btn-primary:hover {
            background-color: #932e2e;
        }
        .btn-secondary {
            background-color: transparent;
            color: #333;
            border: 1px solid #888;
            padding: 16px 45px;
            font-size: 1.1rem;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.2s;
            display: inline-block;
        }
        .btn-secondary:hover {
            background-color: #eae6df;
        }

        /* 반응형 디자인 (모바일 대응) */
        @media (max-width: 768px) {
            header {
                padding: 20px;
                flex-direction: column;
                gap: 15px;
            }
            .hero-section {
                margin-top: 40px;
                text-align: center;
            }
            h1 {
                font-size: 2.2rem;
            }
            .btn-group {
                justify-content: center;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- 상단 헤더 -->
    <header>
        <div class="logo-area">
            <div class="badge">福</div>
            <span class="site-title">수복재</span>
        </div>
        <div class="nav-menu">
            <span onclick="location.href='gallery.html'">작품</span>
            <span onclick="alert('준비 중인 페이지입니다.')">민화 이야기</span>
            <span onclick="alert('준비 중인 페이지입니다.')">작가·문의</span>
        </div>
    </header>

    <!-- 메인 대문 내용 -->
    <main class="hero-section">
        <div class="sub-tag">韓國 · 民畵 · 수복재</div>
        <h1>한 폭의 그림에<br><strong>복을 담습니다</strong></h1>
        <p class="intro-text">
            모란에는 부귀를, 원앙에는 금실을, 석류에는 자손의 번창을 담았습니다.<br>
            옛사람들이 그림에 새긴 소망을 오늘의 공간에 전합니다.
        </p>
        
        <div class="btn-group">
            <a href="gallery.html" class="btn-primary">작품 보기</a>
            <a href="#" class="btn-secondary" onclick="alert('준비 중인 페이지입니다.'); return false;">민화 이야기</a>
        </div>
    </main>

</body>
</html>
