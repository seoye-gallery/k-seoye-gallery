<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원당 서예 갤러리</title>
    
    <!-- 카카오톡, 문자 공유 시 미리보기 카드 설정 -->
    <meta property="og:title" content="원당 서예 갤러리 ｜ 원당 김제운 작가 · 소장가 권영자">
    <meta property="og:description" content="붓끝으로 피워낸 墨香, 삶의 깊이와 평안을 담다. 원당 김제운 작가의 소중한 서예 작품 컬렉션을 소개합니다.">
    <meta property="og:image" content="1.jpg">
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Noto Serif KR', serif, sans-serif;
            background-color: #fbf9f5;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 15px;
        }
        .intro-card {
            background-color: #ffffff;
            color: #222;
            width: 100%;
            max-width: 580px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            text-align: center;
            padding: 25px 20px;
        }
        /* 작품 미리보기 이미지 배열 */
        .preview-images {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .preview-images img {
            width: 30%;
            max-height: 120px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #f0ede6;
        }
        .intro-hanja {
            color: #8b2626;
            font-size: 0.95rem;
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .intro-title {
            font-size: 1.7rem;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 15px;
            color: #111;
            word-break: keep-all;
        }
        .intro-desc {
            font-size: 0.98rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
            word-break: keep-all;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-enter {
            display: inline-block;
            background-color: #8b2626;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1rem;
            font-weight: bold;
            transition: background-color 0.3s;
            flex: 1;
            min-width: 130px;
            max-width: 200px;
        }
        .btn-enter:hover {
            background-color: #6b1c1c;
        }
        .btn-story {
            background-color: #4a4a4a;
        }
        .btn-story:hover {
            background-color: #333333;
        }
    </style>
</head>
<body>

    <div class="intro-card">
        <!-- 작품 미리보기 3개 나란히 -->
        <div class="preview-images">
            <img src="1.jpg" alt="서예 작품 1">
            <img src="2.jpg" alt="서예 작품 2">
            <img src="3.jpg" alt="서예 작품 3">
        </div>
        
        <div class="intro-content">
            <div class="intro-hanja">韓國 書藝 · 元堂 金濟雲 藝苑</div>
            <h1 class="intro-title">
                붓끝으로 피워낸 墨香,<br>
                삶의 깊이와 평안을 담다
            </h1>
            <p class="intro-desc">
                한 자 한 자에 담긴 붓의 기운과 지극한 정성.<br>
                원당 김제운 작가의 서예 컬렉션을 소개합니다.
            </p>
            
            <div class="btn-container">
                <!-- 작품 보기 및 서예 이야기 버튼 -->
                <a href="gallery.html" class="btn-enter">작품 보기</a>
                <a href="gallery.html" class="btn-enter btn-story">서예 이야기</a>
            </div>
        </div>
    </div>

</body>
</html>
