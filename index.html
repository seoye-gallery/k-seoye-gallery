<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-서예 갤러리 | 원당 김제운</title>
  <meta property="og:title" content="원당 서예 갤러리 | 원당 김제운 작가 · 소장가">
  <meta property="og:title" content="K-서예.원당 김제운 갤러리">
 
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Noto Serif KR', serif, sans-serif;
      background-color: #fbf9f5;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .main-card {
      background-color: #ffffff;
      width: 100%;
      max-width: 680px;
      border: 2px solid #333;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 22px;
    }
    .top-lang-bar {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }
    .lang-badge {
      border: 1px solid #666;
      padding: 4px 10px;
      font-size: 0.85rem;
      border-radius: 4px;
      background: #fff;
      color: #222;
      cursor: pointer;
    }
    .lang-badge.active {
      background: #333;
      color: #fff;
      border-color: #333;
      font-weight: bold;
    }
    .top-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }
    .left-title-area {
      flex: 1;
    }
    .menu-icon-box {
      width: 28px;
      height: 28px;
      border: 2px solid #333;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      margin-bottom: 12px;
      border-radius: 4px;
    }
    .main-title {
      font-size: 2rem;
      font-weight: bold;
      color: #111;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .sub-desc {
      font-size: 0.95rem;
      color: #555;
      line-height: 1.55;
    }
    .right-artworks {
      display: flex;
      gap: 12px;
    }
    .artwork-frame {
      width: 112px;
      height: 172px;
      border: 2px solid #333;
      border-radius: 6px;
      padding: 4px;
      background-color: #faf9f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .artwork-frame img {
      width: 100%;
      height: 95px;
      object-fit: contain;
      background: #fff;
      border-radius: 2px;
    }
    .artwork-label {
      font-size: 0.82rem;
      font-weight: bold;
      color: #333;
      margin-top: 4px;
    }
    .middle-section {
      text-align: center;
      padding: 22px 16px;
      background-color: #fcfbfa;
      border: 1px solid #e5e0d8;
      border-radius: 10px;
    }
    .section-big-title {
      font-size: 1.7rem;
      font-weight: bold;
      color: #111;
      margin-bottom: 10px;
    }
    .section-intro-text {
      font-size: 1rem;
      color: #555;
      line-height: 1.6;
    }
    .btn-enter-box {
      margin-top: 18px;
    }
    .btn-enter {
      display: inline-block;
      background-color: #8b2626;
      color: #fff;
      padding: 10px 24px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
    }
    .btn-enter:hover {
      background-color: #6b1c1c;
    }
    .artist-section {
      background-color: #faf7f2;
      border: 1px solid #dfd7c8;
      border-radius: 10px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .artist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .artist-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: #111;
    }
    .artist-inquiry-link {
      font-size: 0.9rem;
      font-weight: bold;
      color: #8b2626;
      text-decoration: none;
      border: 1px solid #8b2626;
      padding: 5px 12px;
      border-radius: 5px;
      background: #fff;
    }
    .artist-inquiry-link:hover {
      background: #8b2626;
      color: #fff;
    }
    .artist-bio {
      font-size: 0.94rem;
      color: #444;
      line-height: 1.6;
    }
    .bottom-url-bar {
      border-top: 2px solid #333;
      padding-top: 14px;
      font-size: 0.88rem;
      color: #333;
      font-weight: bold;
    }
    @media (max-width: 600px) {
      .top-section {
        flex-direction: column;
      }
      .right-artworks {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="main-card">
    <div class="top-lang-bar">
      <button type="button" class="lang-badge active" data-lang="ko" onclick="setActiveLang('ko', this)">한</button>
      <button type="button" class="lang-badge" data-lang="en" onclick="setActiveLang('en', this)">EN</button>
      <button type="button" class="lang-badge" data-lang="ja" onclick="setActiveLang('ja', this)">日</button>
      <button type="button" class="lang-badge" data-lang="zh-CN" onclick="setActiveLang('zh-CN', this)">中</button>
    </div>

    <div class="top-section">
      <div class="left-title-area">
        <div class="menu-icon-box">≡</div>
        <div class="main-title" id="mainTitle">K-서예</div>
        <div class="sub-desc" id="subDesc">
          붓끝으로 피워낸 묵향<br>
          삶의 깊이를 담다
        </div>
      </div>

      <div class="right-artworks">
        <div class="artwork-frame">
          <img src="1.jpg" alt="애 작품">
          <div class="artwork-label" id="label1">애(愛)</div>
        </div>
        <div class="artwork-frame">
          <img src="2.jpg" alt="산 작품">
          <div class="artwork-label" id="label2">산(山)</div>
        </div>
      </div>
    </div>

    <div class="middle-section">
      <div class="section-big-title" id="sectionBigTitle">한국 서예 작품 감상</div>
      <div class="section-intro-text" id="sectionIntroText">
        원당 김제운 서예작가님의 작품을 소개합니다.
      </div>
      <div class="btn-enter-box">
        <a href="gallery.html" class="btn-enter" id="enterBtn">갤러리 입장하기 →</a>
      </div>
    </div>

    <div class="artist-section" id="artist-inquiry">
      <div class="artist-header">
        <div class="artist-title" id="artistTitle">작가 · 원당 김제운</div>
        <a href="artist.html" class="artist-inquiry-link" id="inquiryLink">작가.문의 →</a>
      </div>
      <div class="artist-bio" id="artistBio">
        전통 묵선의 호흡과 절제된 필치를 바탕으로 서예 작품을 선보이는 원당 김제운 작가의 공간입니다. 자세한 작가 소개와 약력은 버튼을 눌러 확인해 주세요.
      </div>
    </div>

    <div class="bottom-url-bar">
      https://seoye-gallery.github.io/k-seoye-gallery/
    </div>
  </div>

  <script>
    const translations = {
      ko: {
        title: "K-서예 갤러리 | 원당 김제운",
        mainTitle: "K-서예",
        subDesc: "붓끝으로 피워낸 묵향<br>삶의 깊이를 담다",
        label1: "애(愛)",
        label2: "산(山)",
        sectionBigTitle: "한국 서예 작품 감상",
        sectionIntroText: "원당 김제운 서예작가님의 작품을 소개합니다.",
        enterBtn: "갤러리 입장하기 →",
        artistTitle: "작가 소개 · 원당 김제운",
        inquiryLink: "작가.문의 →",
        artistBio: "전통 묵선의 호흡과 절제된 필치를 바탕으로 서예 작품을 선보이는 원당 김제운 작가의 공간입니다. 자세한 작가 소개와 약력은 버튼을 눌러 확인해 주세요."
      },
      en: {
        title: "K-Calligraphy Gallery | Wondang Kim Je-un",
        mainTitle: "K-Calligraphy",
        subDesc: "Ink fragrance blooming from the brush tip<br>Capturing the depth of life",
        label1: "Love (愛)",
        label2: "Mountain (山)",
        sectionBigTitle: "Korean Calligraphy Collection",
        sectionIntroText: "Introducing works by calligrapher Wondang Kim Je-un.",
        enterBtn: "Enter Gallery →",
        artistTitle: "Artist Profile · Wondang Kim Je-un",
        inquiryLink: "Artist Profile →",
        artistBio: "A gallery space featuring calligraphy by Wondang Kim Je-un, rooted in traditional ink line and restrained brushwork. Click the button to view the full profile."
      },
      ja: {
        title: "K-書芸ギャラリー | 園堂 キム・ジェウン",
        mainTitle: "K-書芸",
        subDesc: "筆先から広がる墨の香り<br>人生の深みを込める",
        label1: "愛(愛)",
        label2: "山(山)",
        sectionBigTitle: "韓国書芸作品鑑賞",
        sectionIntroText: "園堂 キム・ジェウン書芸作家の作品をご紹介します。",
        enterBtn: "ギャラリーへ入る →",
        artistTitle: "作家紹介 · 園堂 キム・ジェウン",
        inquiryLink: "作家紹介を見る →",
        artistBio: "伝統的な墨線と節度ある筆致で書芸作品を発表する園堂 キム・ジェウン作家のページです。詳しい紹介と略歴はボタンからご覧ください。"
      },
      "zh-CN": {
        title: "K-书法画廊 | 园堂 金济云",
        mainTitle: "K-书法",
        subDesc: "笔尖绽放的墨香<br>承载生命的深邃",
        label1: "爱(愛)",
        label2: "山(山)",
        sectionBigTitle: "韩国书法作品鉴赏",
        sectionIntroText: "介绍园堂 金济云书法家的作品。",
        enterBtn: "进入画廊 →",
        artistTitle: "艺术家介绍 · 园堂 金济云",
        inquiryLink: "查看艺术家介绍 →",
        artistBio: "呈现园堂 金济云先生以传统墨韵与凝练笔法创作的书法作品。点击按钮可查看完整艺术家简介与履历。"
      }
    };

    function setActiveLang(lang, btnEl) {
      document.querySelectorAll('.lang-badge').forEach(function (el) {
        el.classList.remove('active');
      });
      if (btnEl) {
        btnEl.classList.add('active');
      }
      const t = translations[lang] || translations.ko;
      document.title = t.title;
      document.getElementById('mainTitle').textContent = t.mainTitle;
      document.getElementById('subDesc').innerHTML = t.subDesc;
      document.getElementById('label1').textContent = t.label1;
      document.getElementById('label2').textContent = t.label2;
      document.getElementById('sectionBigTitle').textContent = t.sectionBigTitle;
      document.getElementById('sectionIntroText').textContent = t.sectionIntroText;
      document.getElementById('enterBtn').textContent = t.enterBtn;
      document.getElementById('artistTitle').textContent = t.artistTitle;
      document.getElementById('inquiryLink').textContent = t.inquiryLink;
      document.getElementById('artistBio').textContent = t.artistBio;
    }
  </script>
</body>
</html>
